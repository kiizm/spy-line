<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <title>Spy Line</title>

    <!--
      The Playables SDK. The platform requires this exact tag, and requires it to
      come BEFORE any game code (Integration requirement 1, validated at
      publishing). It is the platform's own script, not a third-party service, and
      it is the only external URL in the whole build. It runs as a no-op when the
      page is served outside YouTube. The module script that holds the game is
      deferred by the browser, so this classic script always runs first.
    -->
    <script src="https://www.youtube.com/game_api/v1"></script>

    <!-- No other external tag, ever. See CLAUDE.md, "The one allowed external request". -->

    <!-- An empty icon, so the browser does not request /favicon.ico from the host. -->
    <link rel="icon" href="data:," />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ede9fe;
        overflow: hidden;
        /* System fonts only. No webfont download. */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* The canvas has one pixel per device pixel (see src/game/dpr.js), so it is
         larger than the container and is shown at the container's size. */
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DK-CWP2_.js"></script>
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
